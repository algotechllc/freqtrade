# Freqtrade + daily_summary file logs (bind mount, not Docker json-file logs).
# Install on the server:
#   sudo cp deploy/logrotate-freqtrade.conf /etc/logrotate.d/freqtrade
# Edit paths if your repo is not /home/ubuntu/freqtrade.

/home/ubuntu/freqtrade/user_data/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
